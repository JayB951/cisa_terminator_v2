<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CISA TERMINATOR</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <h1>CISA TERMINATOR</h1>
  </header>

  <!-- TOPBAR -->
  <nav class="topbar">
    <button>Tanulás</button>
    <button>Tesztelés</button>
    <button>Statisztika</button>
    <div class="spacer"></div>
    <button>MENTÉS</button>
  </nav>

  <!-- MAIN LAYOUT -->
  <main class="layout">

    <!-- LEFT PANEL -->
    <aside class="left-panel">

      <h2>Tanuló PDF (Google Drive ID)</h2>

      <input
        id="pdfInput"
        class="input"
        placeholder="pl. 1C5LqfSLHD2NIqhTVjb7GkMZzScMoYKc2"
      />

      <h2 style="margin-top:20px;">Progress</h2>

      <input
        type="file"
        id="progressFile"
        accept=".json,.txt"
      />

    </aside>

    <!-- CENTER VIEWER -->
    <section class="center-panel">

      <iframe id="pdfViewer"></iframe>

      <div id="fallback" class="fallback hidden">
        <button id="openTab">PDF megnyitása új fülön</button>
      </div>

    </section>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">

      <h2>Tanulási eszközök</h2>

      <ul>
        <li>Summary</li>
        <li>Definitions</li>
        <li>Cheat Sheet</li>
        <li>Mind Map</li>
        <li>Flash Cards</li>
      </ul>

    </aside>

  </main>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    Aktív forrás / Progress állapot
  </footer>

</div>

<!-- SCRIPT -->
<script>
  function toDriveUrl(id) {
    return `https://drive.google.com/file/d/${id}/preview`;
  }

  const iframe = document.getElementById("pdfViewer");
  const fallback = document.getElementById("fallback");
  const openTabBtn = document.getElementById("openTab");

  let lastUrl = "";

  // PDF LOAD
  document.getElementById("pdfInput").addEventListener("change", (e) => {
    const id = e.target.value.trim();
    if (!id) return;

    lastUrl = toDriveUrl(id);

    iframe.src = lastUrl;

    // fallback aktiválás (Drive-safe viselkedés)
    setTimeout(() => {
      fallback.classList.remove("hidden");
    }, 1500);
  });

  // OPEN IN NEW TAB
  openTabBtn.addEventListener("click", () => {
    if (lastUrl) {
      window.open(lastUrl, "_blank");
    }
  });

  // PROGRESS LOAD
  document.getElementById("progressFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      console.log("Progress loaded:", evt.target.result);
    };

    reader.readAsText(file);
  });
</script>

</body>
</html>
