<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CISA TERMINATOR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="header">
    <h1>CISA TERMINATOR</h1>
  </header>

  <nav class="topbar">
    <button>Tanulás</button>
    <button>Tesztelés</button>
    <button>Statisztika</button>

    <div class="spacer"></div>

    <button>MENTÉS</button>
  </nav>

  <main class="layout">

    <aside class="left-panel">
      <h2>Források</h2>

      <ul>
        <li>Review</li>
        <li>QBank</li>
        <li>Progress</li>
      </ul>
    </aside>

    <section class="center-panel">
      <h2>PDF Viewer</h2>
      <p>Iteráció 2-ben kerül integrálásra.</p>
    </section>

    <aside class="right-panel">
      <h2>Tanulási eszközök</h2>

      <ul>
        <li>Summary</li>
        <li>Definitions</li>
        <li>Cheat Sheet</li>
        <li>Mind Map</li>
        <li>Flash Cards</li>
      </ul>
    </aside>

  </main>

  <footer class="statusbar">
    Aktív forrás / Domain / Oldal
  </footer>

</div>

</body>
</html>
